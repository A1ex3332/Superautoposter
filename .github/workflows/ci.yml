name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest ruff
      - run: ruff check .
      - run: python -m pytest -q
      - name: Smoke test the CLI without a token
        run: |
          set +e
          out=$(python -m reel_autopost test example 2>&1)
          echo "$out"
          echo "$out" | grep -q "Missing IG_ACCESS_TOKEN"
